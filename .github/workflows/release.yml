name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Aktualisiert
          - Der integrierte **VortexClient Fabric** für Minecraft 26.2 wurde auf Version **2.28.17+26.2** aktualisiert.
          - Die bisherige Version 2.28.14+26.2 wird dadurch im 26.2-Modpack ersetzt.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Dieses Update stellt sicher, dass neue 26.2-Instanzen die aktuelle VortexClient-Modversion enthalten.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
