name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Farbliche Überarbeitung des Update-Fensters
          - Das Update-Fenster verwendet nun die neutrale Anthrazitpalette des Launchers statt der bisherigen dunkelblauen Oberfläche.
          - Gedämpfte Cyan-Akzente heben Update-Symbol, Fortschritt und primäre Aktion klar hervor.
          - Texte, Hinweise und sekundäre Aktionen wurden kontrastreicher und konsistenter abgestimmt.
          - Der Ablauf für Download, Installation und Neustart bleibt unverändert.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Deine Instanzen, Mods, Accounts und Einstellungen bleiben beim Update erhalten.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
