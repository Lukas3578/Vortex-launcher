name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Vortex Client $GITHUB_REF_NAME

          ### Neu
          - Aktueller Vortex-Launcher und Windows-Installer.
          - Verbesserte Cosmetics- und Cape-Unterstützung für Minecraft 1.21.11.
          - Gemeinsame Vortex-Cape-Synchronisierung für Spieler mit aktualisiertem Client.

          ### Behoben
          - Veraltete Vortex-Mod-Dateien und alte Skin-Overlay-Profile werden beim Instanz-Check bereinigt.
          - Cape-Konfiguration und mitgelieferte Assets werden vor dem Start geprüft.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.
          4. Für Multiplayer-Capes müssen alle beteiligten Spieler diese Release-Version verwenden.

          ### Hinweis
          Die Release-Beschreibung dokumentiert den Build-Stand. Ein echter Multiplayer-Test muss mit zwei gestarteten Vortex-Clients durchgeführt werden.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
