name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Neu
          - Vortex Client ohne öffentlichen Cosmetics-Bereich.
          - Photon-Redesign mit moderner Glasmorphism-Oberfläche, besserer Hierarchie und responsivem Layout.
          - Flüssige Seitenübergänge, Hover-Animationen, Ambient-Glow und Reduced-Motion-Unterstützung.
          - Neue Quick Actions mit Ctrl + K für Launch, Navigation, Mods, Instanzen und Ordnerzugriff.
          - Automatische Erkennung und erneute Anmeldung bei ungültigen Minecraft-Sitzungen.
          - Vortex Client Mod für Minecraft 1.21.11 auf Version 2.28.2 aktualisiert.
          - Die gebündelte Datei vortexclient-2.28.2.jar ersetzt die vorherige Mod-Version.
          - Das Vortex Plus Addon für Minecraft 1.21.11 wurde durch die bereitgestellte neue Fassung ersetzt.
          - Die Datei vortex-plus-addon-1.0.0.jar ist im 1.21.11-Modpack aktualisiert.
          - Das Account-Menü wurde mit neuen Active-States, Avatar-Karten, Glow-Effekten und weicheren Interaktionen überarbeitet.
          - Alle Launcher-Kategorien erhalten ein einheitliches Vortex-2.0-Design mit verbesserten Karten, Suchbereichen, Statusanzeigen und Empty-States.
          - Neue Karten-Lichtreflexe, gestaffelte Ladeanimationen, Focus-Ringe und sanftes Scrollen verbessern die Navigation.
          - Enter startet Suchen direkt; Ctrl + Shift + R lädt den Launcher global neu.
          - Zweite Designrunde mit individuellen Motion-Details für Server, Bedrock, Instanzen, Mods, Packs, Community und Cosmetics.
          - AI Studio und Community Skins wurden vollständig aus der Launcher-Oberfläche entfernt.
          - Der F11-Fullscreen-Hinweis wurde aus der Kopfzeile entfernt; die Tastenkombination bleibt weiterhin verfügbar.
          - Die veraltete 3D-Cosmetics-Anzeige wurde aus den Instanzkarten entfernt.
          - Ladefehler nach der Feature-Bereinigung behoben: Instanz-, Mod-, Resource-Pack- und Server-Inhalte werden wieder korrekt gerendert.
          - Verwaiste Community-Skin-Elemente und nicht mehr vorhandene Container werden nicht mehr vom Refresh-Ablauf angesprochen.
          - Die Community ist wieder sichtbar und enthält jetzt ausschließlich Presets und Macros, ohne Community-Skins.
          - Die echte installierte Launcher-Version wird dynamisch im Footer angezeigt.
          - F11 und Escape werden direkt im Electron-Fenster verarbeitet und funktionieren dadurch zuverlässig.
          - Karten reagieren mit sanftem Lichtreflex, tieferen Hover-Lifts und gestaffelten Inhalten auf Interaktionen.
          - Verbesserte Fullscreen- und Wide-Screen-Darstellung mit konsistenter Premium-Oberfläche.
          - Separate Sandbox Vortex App für Tests mit Cosmetics.
          - Klare Trennung zwischen normalem Launcher und Sandbox-Experimenten.

          ### Behoben
          - Cosmetics-Navigation und Cosmetics-Seite sind aus dem normalen Launcher entfernt.
          - Cape-Konfiguration und mitgelieferte Assets werden vor dem Start geprüft.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Cosmetics stehen ausschließlich in der eigenständigen Sandbox Vortex App zur Verfügung.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
