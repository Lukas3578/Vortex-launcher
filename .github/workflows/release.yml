name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Vortex Client 1.0.4 · Modpack Compatibility Fix
          - Ein Modpack wird jetzt anhand seiner eigenen `modrinth.index.json`-Metadaten installiert und nicht mehr versehentlich in der aktuell ausgewählten Version.
          - Ein Pack für Minecraft 1.21.4 landet dadurch in einer echten 1.21.4-Instanz statt in 1.21.11.
          - Java-Anforderungen wie `>=22` werden erkannt; der passende integrierte Java-Runtime-Download wird bei Bedarf vorbereitet.
          - Nach Download, Import oder Community-Installation wird die erkannte Minecraft-Version sofort als aktive Launcher-Version ausgewählt.

          ### Stabilität und Bedienung
          - Die Korrektur gilt für Modrinth-Downloads, lokale `.mrpack`-Imports und Community-Modpacks.
          - Bestehende Instanzen, Mods, Accounts, Server, Modpacks und Aufnahmen bleiben erhalten.
          - Nicht unterstützte oder fehlerhafte Pack-Metadaten werden mit einer verständlichen Fehlermeldung abgewiesen.

          ### Update
          - Für automatische Updates stehen `latest.yml` und die passende `.blockmap` bereit.
          - Die Version 1.0.4 wird als Windows-Installer veröffentlicht.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Die vorhandenen Instanzen, Mods, Accounts und Einstellungen bleiben unverändert erhalten.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
