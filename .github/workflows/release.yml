name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Vortex Client 1.0.20 · Deep Navy UI Update
          - Das gesamte Interface folgt jetzt dem dunklen Vortex-Navy-Stil mit Cyan- und Blau-Akzenten.
          - Control Center, Aktionskarten, Versionsauswahl, Eingabefelder, Statuskarten und rechte Informationsbereiche wurden vollständig vereinheitlicht.
          - Graue Flächen und blasse Übergänge wurden durch tiefe Navy-Flächen, klare Cyan-Kanten und dezente blaue Leuchteffekte ersetzt.
          - Account-Menü, Sidebar, Mod-/Resource-Pack-Karten, Instanzen, Server, Community, Update-Fenster und Cinematic Studio nutzen jetzt dasselbe visuelle System.
          - Hover-, Fokus- und aktive Zustände sind klarer sichtbar und bleiben auch bei längeren Listen und Formularen konsistent.

          ### Launcher-Funktionen
          - Cinematic Studio wurde aus der Oberfläche entfernt und durch das neue Vortex Music Center ersetzt.
          - Eigene MP3-, WAV- und OGG-Dateien können lokal abgespielt werden, inklusive Play/Pause/Stop, Lautstärke, Fortschrittsanzeige und optionalem Loop.
          - Microsoft-Konten werden beim Start geladen und gespeicherte Sitzungen still im Hintergrund aktualisiert.
          - Der Start-Ladebildschirm zeigt jetzt verständlich, wann Accounts, Instanzen und Dienste geladen werden.
          - Der Versions-Transfer kann Mods für die Zielversion neu über Modrinth auflösen und Resource Packs getrennt übernehmen.
          - Cinematic Studio unterstützt Minecraft-Autoerkennung, Spielaudio, Mikrofon-Mixing und globale Hotkeys.

          ### Stabilität
          - Bestehende Instanzen, Mods, Resource Packs und Kontodaten bleiben erhalten.
          - Die Windows-Version wird mit automatischem Update über `latest.yml` und Blockmap ausgeliefert.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
