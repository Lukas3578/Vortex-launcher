name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Vortex Client 1.0.2 · Premium Polish
          - Der gesamte Launcher erhält eine modernere Premium-Oberfläche mit ruhiger Anthrazitbasis und präzisen Cyan-Akzenten.
          - Navigation, Karten und Schnellaktionen reagieren jetzt mit klareren Hover-, Fokus- und Press-Zuständen.
          - Seitenwechsel wirken flüssiger, die visuelle Hierarchie ist klarer und wichtige Aktionen sind schneller erkennbar.
          - Die neue Oberflächenebene ergänzt das Cinematic Studio, die lokale Minecraft-Aufnahme und alle bisherigen Launcher-Funktionen.

          ### Stabilität und Bedienung
          - Bestehende Instanzen, Mods, Accounts, Server, Modpacks und Aufnahmen bleiben erhalten.
          - Die verbesserten Fokuszustände machen den Launcher auch mit Tastatur und Schnellpalette angenehmer bedienbar.
          - Die reduzierte Bewegungsoption des Betriebssystems wird respektiert.

          ### Update
          - Für automatische Updates stehen `latest.yml` und die passende `.blockmap` bereit.
          - Die Version 1.0.2 wird als Windows-Installer veröffentlicht.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Die vorhandenen Instanzen, Mods, Accounts und Einstellungen bleiben unverändert erhalten.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
