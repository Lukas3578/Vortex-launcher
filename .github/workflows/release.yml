name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Vortex Client 1.0.30 · Visual Relaunch
          - Komplett überarbeitetes Design: neue, tiefere Farbpalette mit Cyan-, Blau- und neuem Violett-Akzent für mehr visuelle Tiefe.
          - Durchgehende Animationssprache: sanfte Seitenübergänge, Hover-Effekte mit echtem Tiefeneindruck, Button-Feedback beim Klicken.
          - Die Sidebar hat jetzt einen animierten Auswahl-Indikator, sanftes Glas-Finish und einen dezenten Hover-Effekt auf allen Navigationspunkten.
          - Der Startbildschirm (Hero) hat einen animierten Aurora-Hintergrund und einen leuchtenden, reagierenden Play-Button.
          - Fortschrittsbalken (z. B. beim Update) zeigen jetzt einen Shimmer-Effekt während des Ladens.
          - Fenster (Update-Hinweis, Neuigkeiten) öffnen jetzt mit einer weichen Skalier-Animation statt abrupt zu erscheinen.
          - Karten (Instanzen, Capes, Hüte, Server, Mods) heben sich beim Hover sichtbar an und werfen einen weichen Schatten.
          - Bessere Tastatur-Fokus-Sichtbarkeit für Barrierefreiheit; Animationen respektieren die Systemeinstellung "Bewegung reduzieren".
          - Alle bestehenden Funktionen, Layouts und Bedienelemente bleiben unverändert — es wurde ausschließlich das visuelle Erscheinungsbild verfeinert.

          ### Nutzungshinweis
          - Kein Verhaltensunterschied bei bestehenden Funktionen: Play, Instanzen, Mods, Server, Cosmetics und Updates funktionieren wie gewohnt.
          - Falls eine Animation stört, kann sie über die Systemeinstellung "Bewegungen reduzieren" (Windows: Einstellungen → Barrierefreiheit) deaktiviert werden.

          ### Stabilität
          - Bestehende Instanzen, Mods, Resource Packs und Kontodaten bleiben erhalten.
          - Die Windows-Version wird mit automatischem Update über `latest.yml` und Blockmap ausgeliefert.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
