name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Vortex Client 1.0.5 · Modpack Workspace
          - Installierte Modpacks sind jetzt anklickbar und öffnen einen eigenen isolierten Pack-Workspace.
          - Mods können direkt im ausgewählten Modpack über Modrinth gesucht und hinzugefügt werden.
          - Einzelne Pack-Mods lassen sich aktivieren, deaktivieren oder entfernen, ohne andere Instanzen zu verändern.
          - Der Button `Create your own modpack` exportiert den Inhalt der aktuellen Instanz als eigenes `.mrpack`.
          - Der vorhandene Versions- und Java-Kompatibilitätsfix bleibt enthalten: Pack-Metadaten bestimmen Minecraft-Version und Java-Anforderung.

          ### Stabilität und Bedienung
          - Der Vortex-Core bleibt geschützt und kann nicht versehentlich aus einem Modpack entfernt oder deaktiviert werden.
          - Alle Modpack-Aktionen bleiben auf den jeweiligen isolierten Pack-Ordner begrenzt.
          - Bestehende Instanzen, Mods, Accounts, Server, Modpacks und Aufnahmen bleiben erhalten.

          ### Update
          - Für automatische Updates stehen `latest.yml` und die passende `.blockmap` bereit.
          - Die Version 1.0.5 wird als Windows-Installer veröffentlicht.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Die vorhandenen Instanzen, Mods, Accounts und Einstellungen bleiben unverändert erhalten.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
