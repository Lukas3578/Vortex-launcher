name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Vortex Client $GITHUB_REF_NAME

          ### Vortex Client 1.0.1 · Cinematic Studio
          - Das neue **Cinematic Studio** nimmt Minecraft lokal als WebM-Video auf.
          - Wähle das Minecraft-Fenster im Systemdialog, nutze 720p oder 1080p mit 30 bzw. 60 FPS und speichere die Aufnahme direkt auf deinem PC.
          - Szenenmarker helfen dir, wichtige Momente während der Aufnahme für den späteren Schnitt festzuhalten.
          - Die Aufnahme wird erst nach deinem Klick gestartet; es erfolgt kein Upload an Vortex oder Dritte.

          ### Erweiterte Kategorien
          - Die Serverbibliothek kann jetzt alle gespeicherten Server in einem Schritt aktualisieren.
          - Der Ressourcenpaket-Bereich hat einen direkten Zugriff auf den lokalen Ordner der aktiven Instanz.
          - Das Kontrollzentrum und die Schnellsuche bieten einen noch schnelleren Einstieg in Mods, Instanzen und das Cinematic Studio.

          ### Installation
          1. Den Windows-Installer aus diesem Release herunterladen.
          2. Die vorherige Launcher-Version schließen und den Installer ausführen.
          3. Minecraft anschließend ausschließlich über **Launch Vortex** starten.

          ### Hinweis
          Die vorhandenen Instanzen, Mods, Accounts und Einstellungen bleiben unverändert erhalten.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Vortex Client $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows-Installer bauen und GitHub Release veröffentlichen
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
