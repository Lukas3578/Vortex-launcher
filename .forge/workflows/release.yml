
name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: forge/checkout@v1

      - name: Node.js einrichten
        uses: forge/setup-node@v1
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Release vorbereiten
        run: |
          echo "Vortex Client Release wird vorbereitet"
          echo "Version: ${{ github.ref_name }}"

      - name: Windows-Installer bauen
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
